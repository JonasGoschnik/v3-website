<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V3 – Coming Soon</title>
<meta name="description" content="V3: modulare, handgenähte T-Shirts aus Salzburg. Coming Soon.">
<meta name="theme-color" content="#3e9b22">
<meta property="og:type" content="website">
<meta property="og:title" content="V3 – Coming Soon">
<meta property="og:description" content="Modulare T-Shirts, bewusst gefertigt und persönlich gestaltbar – von Hand genäht in Salzburg.">
<meta property="og:url" content="https://v3-project.com">
<meta name="robots" content="index,follow">
<style>:root{color-scheme:light;}html,body{margin:0;padding:0;}body{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;}img{max-width:100%;}[hidden]{display:none!important;}</style>
<style>
  /* Single committed visual world: pure white paper, kept constant regardless
     of OS theme. The whole point of this direction is genuine white space,
     so the page stays on true white rather than inverting to a dark UI. */
  :root{
    --paper: #ffffff;
    --ink: #1c1c1c;
    --ink-soft: #8c877d;
    --ink-faint: #b8b3a9;
    --line: #ededea;
    --accent: #B8E62E;            /* Markengrün (Neon) */
    --accent-deep: #55750a;       /* dunkles Lime für kleine Texte auf Weiß */
    --accent-wash: rgba(184,230,46,.30);


    --on-accent: #f5f7ec;         /* nur Hero (dunkelgrüner Hintergrund) */
    --hero-a: #4aad2d; --hero-b: #3e9b22; --hero-c: #2f7818;
  }

  *{box-sizing:border-box;}
  html,body{background:var(--paper);}
  body{
    margin:0;
    color:var(--ink);
    background:var(--paper);
    font-family:'IBM Plex Sans', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:#e2f5a6;color:var(--ink);}

  h1,h2,h3{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;text-wrap:balance;margin:0;font-weight:700;}
  p{line-height:1.7;color:var(--ink);margin:0;}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- minimal top bar ---------- */
  .chrome{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    padding:18px 6vw;
    border-bottom:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.06em;
    color:var(--ink-soft);
  }
  .chrome-label{text-transform:uppercase;}
  .switch{display:flex;gap:16px;}
  .switch button{
    background:transparent;border:0;color:var(--ink-faint);
    padding:2px 0;font-size:11px;letter-spacing:.06em;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
    border-bottom:1px solid transparent;
  }
  .switch button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink);}
  .switch button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}

  /* ---------- page ---------- */
  nav{
    display:flex;align-items:center;justify-content:center;
    padding:22px 6vw;
    position:sticky;top:0;z-index:60;
    background:linear-gradient(var(--accent-wash),var(--accent-wash)) , var(--paper);
    border-bottom:1px solid var(--line);
    box-shadow:0 1px 0 var(--line);
    transition:padding .35s ease,box-shadow .35s ease;
  }
  nav.scrolled{
    padding-top:13px;padding-bottom:13px;
    box-shadow:0 2px 10px rgba(18,18,18,.06);
  }
  .scroll-progress{
    position:absolute;left:0;right:0;bottom:-1px;z-index:1;height:3px;width:0%;
    background:var(--accent-deep);
    transition:width .12s linear;
  }
  nav .navlinks{display:flex;gap:34px;font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);}
  nav .navlinks a{position:relative;color:inherit;text-decoration:none;padding-bottom:4px;transition:color .25s ease;}
  nav .navlinks a:hover{color:var(--ink);}
  nav .navlinks a::after{
    content:"+";position:absolute;left:-14px;top:-2px;color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:700;
    opacity:0;transform:scale(.6);transition:opacity .25s ease,transform .3s ease;
  }
  nav .navlinks a:hover::after{opacity:.7;transform:scale(1);}
  nav .navlinks a.active{color:var(--ink);}
  nav .navlinks a.active::after{opacity:1;transform:scale(1);}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo img{width:24px;height:24px;display:block;}
  .logo b{font-family:'Big Shoulders Display';font-weight:700;font-size:17px;letter-spacing:.02em;}

  .eyebrow::before{content:"+";color:var(--accent-deep);font-weight:700;font-size:14px;margin-right:8px;}
  .eyebrow{
    font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);
  }

  .status{
    font-family:'IBM Plex Mono';font-size:12px;letter-spacing:.03em;color:var(--ink-soft);
    display:flex;align-items:center;gap:8px;
  }
  .status::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none;}

  .section-head{display:flex;flex-direction:column;gap:6px;margin-bottom:44px;}
  .section-head h2{font-size:clamp(24px,3vw,34px);font-weight:700;}

  section.block{max-width:1180px;margin:0 auto;padding:66px 6vw 0;}

  /* ---------- scroll-reveal ---------- */
  .reveal{opacity:0;transform:translateY(26px);transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1);}
  .reveal.in-view{opacity:1;transform:none;}
  @media (prefers-reduced-motion:reduce){
    .reveal{opacity:1;transform:none;transition:none;}
  }

  /* hero — full-bleed green band, warm and welcoming rather than a hard-edged frame */
  .hero-band{
    position:relative;
    background-image:linear-gradient(155deg, var(--hero-a) 0%, var(--hero-b) 45%, var(--hero-c) 100%);
    background-size:140% 140%;
    background-position:0% 0%;
    overflow:hidden;
    animation:heroDrift 17s ease-in-out infinite alternate;
  }
  @keyframes heroDrift{ to{ background-position:100% 45%; } }
  .hero-band::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    opacity:.03;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .hero-glow{
    position:absolute;z-index:1;pointer-events:none;
    width:min(46vw,440px);height:min(46vw,440px);
    left:28%;top:22%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, var(--paper) 0%, var(--paper) 94%, rgba(255,255,255,0) 100%);
    opacity:0;
    transition:left .5s cubic-bezier(.16,1,.3,1), top .5s cubic-bezier(.16,1,.3,1), opacity .45s ease;
  }
  .hero-band.lit .hero-glow{opacity:1;}
  .hero-band::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    background:linear-gradient(to bottom, rgba(0,0,0,0) 88%, var(--paper) 100%);
  }
  .hero{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:8vw 6vw 7vw;}
  .hero-brand{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:.15em;margin:22px 0;}
  .hero-intro-word{
    font-family:'Big Shoulders Display';font-weight:700;
    font-size:clamp(26px,4.6vw,58px);
    line-height:1;color:var(--on-accent);white-space:nowrap;
    opacity:0;
    animation:introWordReveal 1s cubic-bezier(.16,1,.3,1) .15s forwards;
  }
  @keyframes introWordReveal{
    0%{opacity:0;transform:translateX(-10px);}
    100%{opacity:1;transform:translateX(0);}
  }
  .hero-logo{margin:0;line-height:0;}
  .hero-logo img{
    width:clamp(220px,32vw,460px);
    display:block;
    opacity:0;
    clip-path:inset(100% 0 0 0);
    animation:logoReveal 1.4s cubic-bezier(.16,1,.3,1) 1s forwards;
  }
  @keyframes logoReveal{ to{opacity:1;clip-path:inset(0 0 0 0);} }
  .hero-text-mask{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    display:flex;flex-direction:column;align-items:flex-start;gap:.15em;
    -webkit-mask-image:radial-gradient(circle var(--mr,0px) at var(--mx,-999px) var(--my,-999px), #000 0%, #000 85%, transparent 100%);
    mask-image:radial-gradient(circle var(--mr,0px) at var(--mx,-999px) var(--my,-999px), #000 0%, #000 85%, transparent 100%);
  }
  .hero-text-mask .hero-intro-word{color:#141414;animation:none;opacity:1;transform:none;}
  .hero-text-mask .hero-logo img{filter:brightness(0) saturate(100%);animation:none;opacity:1;clip-path:none;}
  @media (prefers-reduced-motion:reduce){
    .hero-band{animation:none;}
    .hero-glow{transition:none;opacity:0;}
    .hero-intro-word{animation:none;opacity:1;transform:none;}
    .hero-logo img{opacity:1;clip-path:inset(0 0 0 0);animation:none;}
    .hero-band::before{display:none;}
    .hero-text-mask{display:none;}
  }
  .tagline-wrap{position:relative;margin-top:20px;}
  .hero .tagline{font-size:18px;margin:0;color:var(--on-accent);max-width:520px;font-weight:400;}
  .tagline-mask{
    position:absolute;top:0;left:0;right:0;margin:0;pointer-events:none;
    font-size:18px;max-width:520px;font-weight:400;color:#141414;
    -webkit-mask-image:radial-gradient(circle var(--tr,0px) at var(--tx,-999px) var(--ty,-999px), #000 0%, #000 85%, transparent 100%);
    mask-image:radial-gradient(circle var(--tr,0px) at var(--tx,-999px) var(--ty,-999px), #000 0%, #000 85%, transparent 100%);
  }
  @media (prefers-reduced-motion:reduce){
    .tagline-mask{display:none;}
  }
  .hero .status{margin-top:26px;color:var(--on-accent);}
  .hero .status::before{background:var(--on-accent);}


  /* ---------- overview strip ---------- */
  .overview{max-width:1180px;margin:0 auto;padding:44px 6vw 0;}
  .ov-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px;margin-bottom:22px;}
  .ov-head h2{font-size:clamp(26px,3.2vw,38px);}
  .ov-formula{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.05em;color:var(--ink-soft);}
  .ov-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:18px;}
  .ov-step{
    display:flex;flex-direction:column;gap:4px;height:100%;
    border-top:3px solid var(--accent);padding:14px 0 6px;text-decoration:none;color:inherit;
    transition:border-color .25s ease, transform .35s cubic-bezier(.16,1,.3,1);
  }
  .ov-step:hover{border-top-color:var(--ink);transform:translateY(-3px);}
  .ov-step:hover .ov-n{color:var(--accent-deep);}
  .ov-step:focus-visible{outline:2px solid var(--ink);outline-offset:4px;}
  .ov-n{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--accent-deep);}
  .ov-name{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:700;font-size:24px;line-height:1.05;}
  .ov-txt{font-size:14px;line-height:1.5;color:var(--ink-soft);}
  .ov-foot{display:flex;flex-wrap:wrap;gap:18px 32px;align-items:center;justify-content:space-between;margin-top:26px;padding-top:22px;border-top:1px solid var(--line);}
  .ov-facts{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 26px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .ov-facts li{display:flex;align-items:center;gap:8px;}
  .ov-facts li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none;}
  .ov-cta{display:flex;flex-wrap:wrap;gap:10px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
    padding:13px 20px;border:1px solid transparent;text-decoration:none;cursor:pointer;line-height:1.2;text-align:center;
    transition:background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
  }
  .btn:focus-visible,.btn-text:focus-visible,.copy-btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  .btn-primary{background:var(--accent);color:var(--ink);border-color:var(--ink);}
  .btn-primary:hover{background:var(--ink);color:var(--accent);}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--ink);}
  .btn-ghost:hover{background:var(--ink);color:#fff;}

  /* ---------- system / module picker ---------- */
  section.block#system{
    background:#f6f6f3;max-width:1180px;
    padding:52px 6vw 60px;margin-top:56px;
  }
  section.block#system + section.block{padding-top:66px;}
  .sys-intro{display:flex;flex-wrap:wrap;gap:16px 40px;align-items:flex-end;justify-content:space-between;margin-bottom:12px;}
  .sys-intro p{max-width:600px;font-size:16.5px;color:var(--ink);}
  .sys-math{display:flex;align-items:center;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.05em;color:var(--ink-soft);text-transform:uppercase;}
  .sys-math b{color:var(--accent-deep);font-weight:500;}
  .sys-hint{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-bottom:6px;line-height:1.6;}

  .stepper{
    position:sticky;top:var(--nav-h,50px);z-index:40;
    display:flex;gap:8px;overflow-x:auto;padding:12px 0;margin:6px 0 4px;
    background:#f6f6f3;border-bottom:1px solid #e3e3dd;scrollbar-width:none;
  }
  .stepper::-webkit-scrollbar{display:none;}
  .step-chip{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;
    padding:8px 13px;background:#fff;border:1px solid #e3e3dd;
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.03em;color:var(--ink);text-decoration:none;
    transition:background .25s ease,border-color .25s ease,color .25s ease;
  }
  .step-chip .n{color:var(--ink-faint);}
  .step-chip .tick{display:none;width:12px;height:12px;}
  .step-chip:hover{border-color:var(--ink-faint);}
  .step-chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .step-chip.done{background:var(--accent);border-color:var(--ink);color:var(--ink);}
  .step-chip.done .n{display:none;}
  .step-chip.done .tick{display:inline-block;}

  .mrow{
    display:grid;grid-template-columns:210px 1fr;gap:18px 32px;
    padding:30px 0;border-top:1px dashed #cfcfc7;scroll-margin-top:62px;
  }
  .mrow:first-child{border-top:0;}
  .mtag{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--accent-deep);}
  .mhead{display:flex;flex-direction:column;gap:6px;align-self:start;}
  .mhead h3{font-size:30px;line-height:1.02;}
  .mq{font-size:14.5px;color:var(--ink-soft);line-height:1.5;}
  .mhint{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);line-height:1.55;margin-top:6px;}
  .mbody{min-width:0;display:flex;flex-direction:column;gap:22px;}
  .opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
  .opt{
    position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:14px;
    text-align:left;padding:18px 16px 18px;background:#fff;border:1px solid #e3e3dd;color:var(--ink);
    font:inherit;cursor:pointer;
    transition:border-color .2s ease,box-shadow .2s ease,transform .3s cubic-bezier(.16,1,.3,1);
  }
  .opt:hover{border-color:var(--ink-faint);transform:translateY(-2px);}
  .opt:focus-visible,.xchip:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink),5px 5px 0 var(--accent);background:#fbfdf1;}
  .opt .ill{width:54px;height:54px;flex:none;color:var(--ink);transition:color .2s ease;}
  .opt[aria-pressed="true"] .ill{color:var(--ink);}
  .otext{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .oid{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-soft);}
  .oname-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;}
  .oname{font-weight:500;font-size:16.5px;line-height:1.25;}
  .odesc{font-size:14px;line-height:1.5;color:var(--ink-soft);}
  .pill{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink);background:var(--accent);border:1px solid var(--ink);padding:2px 6px;line-height:1.3;
  }
  .pill-solid{background:var(--ink);border-color:var(--ink);color:var(--accent);}
  .chk{
    position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;
    border:1px solid #d5d5cf;display:flex;align-items:center;justify-content:center;
    color:transparent;background:#fff;transition:background .2s ease,border-color .2s ease,color .2s ease;
  }
  .chk svg{width:11px;height:11px;}
  .opt[aria-pressed="true"] .chk{background:var(--accent);border-color:var(--ink);color:var(--ink);}

  .swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
  .opt.sw{flex-direction:row;align-items:center;gap:14px;padding:14px 44px 14px 14px;}
  .opt.sw .otext{gap:0;}
  .opt.sw .oname{font-size:16px;}
  .sw-dot{width:36px;height:36px;border-radius:50%;border:1px solid #bdbdb5;flex:none;display:flex;align-items:center;justify-content:center;}
  .sw-dot.sw-custom{border-style:dashed;background:#fff;font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--ink-soft);}
  .opt.sw[aria-pressed="true"] .sw-dot{box-shadow:0 0 0 2px #fff,0 0 0 3px var(--ink);}
  .opt.sw .chk{top:50%;transform:translateY(-50%);}
  .color-custom{display:flex;flex-direction:column;gap:6px;max-width:420px;}
  .color-custom label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
  .color-custom input{font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:0;}
  .color-custom input:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .subrow{display:flex;flex-direction:column;gap:12px;}
  .subhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;}
  .subhead .sn{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:700;font-size:21px;line-height:1.1;}
  .subhead .sq{font-size:13.5px;color:var(--ink-soft);}
  .opt.fixed{cursor:default;flex-direction:row;align-items:center;gap:18px;background:transparent;border-style:dashed;}
  .opt.fixed:hover{transform:none;border-color:#e3e3dd;}
  .opt.fixed .ill{color:var(--ink);}
  .opt.fixed .odesc{max-width:560px;}
  .xchips{display:flex;flex-wrap:wrap;gap:10px;}
  .xchip{
    display:inline-flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;background:#fff;border:1px solid #e3e3dd;
    font:inherit;font-size:14.5px;color:var(--ink);cursor:pointer;
    transition:border-color .2s ease,background .2s ease,color .2s ease;
  }
  .xchip .xill{width:30px;height:30px;flex:none;}
  .xchip .xplus{width:18px;text-align:center;font-family:'IBM Plex Mono',monospace;color:var(--ink-faint);font-size:16px;line-height:1;}
  .xchip:hover{border-color:var(--ink-faint);}
  .xchip[aria-pressed="true"]{border-color:var(--ink);background:var(--accent);color:var(--ink);}
  .xchip[aria-pressed="true"] .xplus{color:var(--ink);}
  .xchip[aria-pressed="true"] .xplus::before{content:"✓";}
  .xchip[aria-pressed="true"] .xplus{font-size:0;}
  .xchip[aria-pressed="true"] .xplus::before{font-size:14px;}

  /* summary */
  .sumpanel{margin-top:14px;padding:30px 30px 26px;background:var(--ink);color:#fff;scroll-margin-top:70px;}
  .sum-head{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px;}
  .sum-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);}
  .sumpanel h3{font-size:clamp(28px,3.4vw,40px);color:#fff;margin-top:4px;line-height:1;}
  .sum-progress{font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.04em;border:1px solid var(--accent);color:var(--accent);padding:5px 10px;}
  .sum-list{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px;border-top:1px solid rgba(255,255,255,.3);}
  .srow{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.3);align-items:baseline;}
  .srow dt{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);}
  .srow dd{margin:0;font-size:16px;font-weight:500;line-height:1.35;overflow-wrap:anywhere;}
  .srow dd.empty{font-weight:400;opacity:.65;font-size:14.5px;}
  .srow.fixed-row dd{font-weight:400;opacity:.92;font-size:14.5px;}
  .sum-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:22px;}
  .btn-light{background:var(--accent);color:var(--ink);}
  .btn-light:hover{background:#fff;}
  .btn-line{background:transparent;color:#fff;border-color:rgba(255,255,255,.65);}
  .btn-line:hover{background:rgba(255,255,255,.14);border-color:#fff;}
  .btn-text{background:none;border:0;padding:8px 6px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);opacity:1;cursor:pointer;text-decoration:none;}
  .btn-text:hover{opacity:1;}
  .sumpanel .btn:focus-visible,.sumpanel .btn-text:focus-visible{outline-color:#fff;}
  .sum-note{margin-top:18px;font-size:14px;line-height:1.6;color:#fff;opacity:.92;max-width:720px;}
  .sum-mailtext{font-family:'IBM Plex Mono',monospace;font-size:13px;user-select:all;overflow-wrap:anywhere;}
  .sum-status{min-height:1.4em;margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#fff;}
  .sum-fallback{width:100%;min-height:150px;margin-top:8px;padding:10px;font:13px/1.5 'IBM Plex Mono',monospace;color:var(--ink);background:#fff;border:0;resize:vertical;}

  /* philosophy */
  .philosophy{max-width:600px;}
  .philosophy p{font-size:17px;color:var(--ink);}
  .philosophy .grow{margin-top:26px;font-family:'Big Shoulders Display';font-weight:700;font-size:20px;color:var(--ink-soft);}
  .philosophy-sub{margin-top:34px;padding-top:28px;border-top:1px solid var(--line);max-width:640px;}
  .philosophy-sub .subpoint-tag{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:12px;}
  .philosophy-sub .subpoint-tag::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);flex:0 0 auto;}
  .philosophy-sub p{font-size:16px;color:var(--ink);}

  .concept-body{max-width:660px;}
  .concept-body p{font-size:16px;color:var(--ink);margin-bottom:18px;}
  .concept-body p:last-of-type{margin-bottom:0;}
  .concept-open{margin-top:26px;font-family:'Big Shoulders Display';font-weight:700;font-size:19px;color:var(--accent-deep);max-width:660px;}

  .pillars-head{margin-top:48px;font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);}
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:16px;}
  .pillars-head{margin-top:44px;}
  .pillar{border-top:3px solid var(--accent);padding-top:16px;max-width:340px;}
  .pillar-tag{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-deep);}
  .pillar-tag::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);flex:0 0 auto;}
  .pillar p{margin-top:10px;font-size:14.5px;color:var(--ink-soft);line-height:1.6;}
  .pillar-tag .pnum{color:var(--accent-deep);font-weight:500;margin-right:2px;}
  .v3-motto{margin-top:44px;padding:30px 0 6px;border-top:1px solid var(--line);}
  .motto-title{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:700;font-size:clamp(30px,4.2vw,50px);line-height:1;}
  .motto-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 48px;margin-top:26px;max-width:880px;}
  .motto-item{display:flex;gap:20px;align-items:flex-start;}
  .motto-key{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:900;font-size:72px;line-height:.85;color:var(--ink);text-shadow:4px 4px 0 var(--accent);flex:none;min-width:48px;}
  .motto-item:nth-child(2) .motto-key{text-shadow:4px 4px 0 var(--accent);}
  .motto-label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);}
  .motto-item strong{display:block;font-size:18px;font-weight:600;margin-top:2px;}
  .motto-item p{margin-top:8px;font-size:14.5px;color:var(--ink-soft);line-height:1.6;}

  .roadmap-head{margin-top:52px;font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);}
  .roadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:16px;}
  .roadmap-phase{border-top:3px solid var(--line);padding-top:16px;}
  .roadmap-phase.active{border-top-color:var(--accent);}
  .roadmap-phase .rm-head{display:flex;justify-content:space-between;align-items:baseline;font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-faint);letter-spacing:.05em;}
  .roadmap-phase .rm-name{margin-top:10px;font-family:'Big Shoulders Display';font-weight:700;font-size:17px;color:var(--ink);line-height:1.15;}
  .roadmap-phase .rm-focus{margin-top:8px;font-size:12.5px;color:var(--ink-soft);line-height:1.55;}
  .roadmap-phase .rm-status{display:inline-block;margin-top:12px;font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);background:var(--accent);padding:3px 8px;}

  /* about */
  .about-wrap{display:grid;grid-template-columns:150px 1fr;gap:34px;align-items:start;}
  .about-wrap p{font-size:16px;max-width:560px;}
  .about-wrap .sublist{margin-top:16px;font-family:'IBM Plex Mono';font-size:12px;color:var(--ink-soft);}
  .slot{
    background:#f6f6f3;border:1px dashed var(--line);
    display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;
  }
  .slot .slot-label{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);}
  .portrait-slot{aspect-ratio:1;overflow:hidden;}
  .portrait-slot img{width:100%;height:100%;object-fit:cover;display:block;}


  /* ---------- Markenbasis: Statement, Marker, Siebdruck-Details ---------- */
  .mark{
    color:var(--accent);
  }
  .statement{
    font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:800;
    font-size:clamp(32px,5.2vw,68px);line-height:1.04;max-width:960px;margin:0 0 40px;text-wrap:balance;
  }
  .positioning{font-size:clamp(20px,2.3vw,27px);line-height:1.42;font-weight:500;max-width:840px;color:var(--ink);}
  .v3-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:40px;}
  .v3-card{border:1px dashed #b9b9b0;padding:22px 22px 24px;background:#fff;}
  .v3-card.hl{background:var(--accent-wash);border-color:var(--ink);box-shadow:5px 5px 0 var(--accent);}
  .v3-card .k{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);}
  .v3-card .k::before{content:"+";color:var(--accent-deep);font-size:20px;font-weight:700;line-height:1;}
  .v3-card p{margin-top:12px;font-size:15.5px;line-height:1.6;color:var(--ink);}
  .story{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px 40px;margin-top:56px;padding-top:30px;border-top:1px dashed #cfcfc7;}
  .story h3{font-size:30px;line-height:1.02;}
  .story-body{max-width:660px;}
  .story-body p{font-size:16.5px;color:var(--ink);margin-bottom:18px;}
  .story-body p:last-child{margin-bottom:0;font-weight:500;}
  .values{margin-top:48px;}
  .values-head{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
  .vchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .vchip{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.03em;color:var(--ink);
    border:1px solid var(--ink);padding:7px 13px;background:#fff;
    transition:background .2s ease,border-color .2s ease;
  }
  .vchip:hover{background:var(--accent);border-color:var(--ink);color:var(--ink);}
  .values-text{margin-top:18px;max-width:700px;font-size:16px;color:var(--ink);}
  section.block#system{position:relative;}
  section.block#system::before,section.block#system::after{
    content:"+";position:absolute;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:26px;line-height:1;color:var(--accent-deep);
  }
  section.block#system::before{top:14px;left:16px;}
  section.block#system::after{bottom:14px;right:16px;}
  .insta{margin-top:30px;}
  .insta-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .insta-tags span{
    display:inline-flex;align-items:center;gap:7px;border:1px dashed rgba(255,255,255,.45);padding:6px 11px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:#fff;
  }
  .insta-tags span::before{content:"+";color:var(--accent);font-size:18px;font-weight:700;line-height:1;}
  .contact-lead h2 .mark{color:var(--accent);background:none;padding:0;}
  @media (max-width:900px){ .v3-cards{grid-template-columns:1fr;} }
  @media (max-width:760px){ .story{grid-template-columns:1fr;gap:14px;margin-top:44px;} section.block#system::before,section.block#system::after{display:none;} }


  /* ---------- Conversion-Onepager ---------- */
  .pain-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 40px;max-width:900px;}
  .pain-list li{position:relative;padding:14px 0 14px 28px;border-top:1px dashed #cfcfc7;font-size:17px;line-height:1.5;color:var(--ink);}
  .pain-list li::before{content:"+";position:absolute;left:0;top:11px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:20px;color:var(--accent-deep);}
  .pain-text{margin-top:30px;max-width:680px;font-size:17px;color:var(--ink-soft);line-height:1.65;}
  .bridge{margin-top:34px;font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:800;font-size:clamp(34px,5vw,60px);line-height:1;color:var(--ink);}
  .steps3{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;}
  .step3{border-top:3px solid var(--accent);padding-top:16px;display:flex;flex-direction:column;gap:8px;}
  .step-n{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--accent-deep);}
  .step-t{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:800;font-size:32px;line-height:1;}
  .step-d{font-size:16px;line-height:1.55;color:var(--ink);}
  .solution-cta{margin-top:30px;}
  .v3-cards.v4{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:14px;}
  details.more{margin-top:40px;border-top:1px dashed #cfcfc7;border-bottom:1px dashed #cfcfc7;padding:0;}
  details.more > summary{
    cursor:pointer;list-style:none;padding:16px 0;font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;
    display:flex;align-items:center;justify-content:space-between;
  }
  details.more > summary::-webkit-details-marker{display:none;}
  details.more > summary::after{content:"+";font-size:22px;font-weight:700;color:var(--accent-deep);line-height:1;}
  details.more[open] > summary::after{content:"\2212";}
  details.more > summary:focus-visible,.faq-item summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  details.more .philosophy{padding:6px 0 24px;}
  details.more + .v3-motto{margin-top:48px;}
  .proof-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;}
  .proof-card{border-top:3px solid var(--ink);padding-top:16px;}
  .proof-k{display:block;font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:800;font-size:28px;line-height:1.05;}
  .proof-card p{margin-top:10px;font-size:15px;line-height:1.55;color:var(--ink-soft);}
  .proof-link{margin-top:28px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);}
  .proof-link a{color:var(--ink);font-weight:500;text-decoration:none;background:var(--accent);padding:1px 6px;}
  .faq{max-width:820px;border-top:1px solid var(--ink);}
  .faq-item{border-bottom:1px solid var(--line);}
  .faq-item summary{
    cursor:pointer;list-style:none;padding:20px 0;font-size:18px;font-weight:500;line-height:1.35;
    display:flex;gap:20px;align-items:center;justify-content:space-between;
  }
  .faq-item summary::-webkit-details-marker{display:none;}
  .faq-item summary::after{content:"+";flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid var(--ink);font-family:'IBM Plex Mono',monospace;font-size:18px;line-height:1;transition:background .2s ease;}
  .faq-item[open] summary::after{content:"\2212";background:var(--accent);}
  .faq-item p{padding:0 48px 22px 0;font-size:16px;line-height:1.65;color:var(--ink);max-width:680px;}
  .contact-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;}
  .sticky-cta{
    position:fixed;z-index:70;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));
    background:var(--accent);color:var(--ink);border:1px solid var(--ink);text-decoration:none;
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:13px 18px;
    box-shadow:4px 4px 0 var(--ink);
    opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .3s ease,transform .3s ease;
  }
  .sticky-cta.show{opacity:1;transform:none;pointer-events:auto;}
  .sticky-cta:hover{background:var(--ink);color:var(--accent);box-shadow:4px 4px 0 var(--accent);}
  .sticky-cta:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  @media (prefers-reduced-motion:reduce){ .sticky-cta{transition:none;transform:none;} }
  @media (max-width:1000px){ .swatches{grid-template-columns:repeat(2,minmax(0,1fr));} .v3-cards.v4{grid-template-columns:repeat(2,minmax(0,1fr));} .proof-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width:760px){
    .pain-list{grid-template-columns:1fr;gap:0;}
    .steps3{grid-template-columns:1fr;}
    .v3-cards.v4,.proof-grid{grid-template-columns:1fr;}
    .faq-item summary{font-size:17px;}
    .faq-item p{padding-right:0;}
    .sticky-cta{left:max(16px,env(safe-area-inset-left,0px));text-align:center;}
  }

  /* ---------- contact / footer ---------- */
  footer.mockfoot{margin-top:70px;padding:60px 6vw 26px;background:var(--ink);color:#fff;}
  .contact-inner{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.05fr 1fr;gap:34px 64px;align-items:start;}
  .c-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);}
  .contact-lead h2{font-size:clamp(34px,5vw,58px);line-height:1.14;color:#fff;margin-top:12px;}
  .contact-lead p{color:#fff;opacity:.95;font-size:16.5px;max-width:440px;margin-top:18px;}
  .contact-list{list-style:none;margin:0;padding:0;border-top:1px solid rgba(255,255,255,.3);}
  .contact-list li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.3);}
  .c-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;}
  .c-note{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;text-align:right;}
  .c-val{font-size:16.5px;color:#fff;text-decoration:none;overflow-wrap:anywhere;line-height:1.4;}
  a.c-val{color:var(--accent);justify-self:start;}
  a.c-val:hover{color:#fff;}
  a.c-val:focus-visible{outline:2px solid #fff;outline-offset:3px;}
  .copy-btn{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;padding:5px 10px;cursor:pointer;
    transition:background .2s ease;
  }
  .copy-btn:hover{background:rgba(255,255,255,.16);}
  .copy-btn:focus-visible{outline-color:#fff;}
  footer.mockfoot .foot-inner{
    max-width:1180px;margin:46px auto 0;padding-top:20px;border-top:1px solid rgba(255,255,255,.3);
    display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;
  }
  footer.mockfoot .logo b{color:var(--accent);}
  footer.mockfoot .foot-line{font-size:13px;color:#fff;opacity:.9;}

  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--nav-h,50px) + 6px);}
  @media (prefers-reduced-motion:no-preference){ html{scroll-behavior:smooth;} }
  @media (prefers-reduced-motion:reduce){ .ov-step,.opt{transition:none;} .ov-step:hover,.opt:hover{transform:none;} }

  @media (max-width:900px){
    .ov-steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 18px;}
    .contact-inner{grid-template-columns:1fr;gap:30px;}
  }
  @media (max-width:760px){
    .mrow{grid-template-columns:1fr;gap:16px;padding:26px 0;}
    .mhead{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 12px;}
    .mhead h3{font-size:27px;}
    .mq,.mhint{flex-basis:100%;}
    .mhint{margin-top:0;}
    .opts{grid-template-columns:1fr;gap:10px;}
    .swatches{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
    .opt.sw{padding:12px 34px 12px 12px;gap:10px;}
    .opt.sw .chk{right:8px;}
    .sw-dot{width:30px;height:30px;}
    .opt{flex-direction:row;align-items:center;gap:14px;padding:14px 46px 14px 14px;}
    .opt .ill{width:46px;height:46px;}
    .chk{top:50%;transform:translateY(-50%);right:14px;}
    .opt.fixed{padding-right:14px;}
    .sum-list{grid-template-columns:1fr;}
    .sumpanel{padding:24px 18px 22px;}
    .sum-actions .btn{flex:1 1 100%;}
    .contact-list li{grid-template-columns:minmax(0,1fr) auto;}
    .c-label{grid-column:1 / -1;}
    .c-note{grid-column:1 / -1;text-align:left;}
    footer.mockfoot{padding-top:48px;}
  }
  @media (max-width:520px){
    .ov-steps{grid-template-columns:1fr;gap:0;}
    .ov-step{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:2px 12px;border-top:1px solid var(--line);padding:12px 0;}
    .ov-step:hover{transform:none;}
    .ov-name{font-size:22px;}
    .ov-txt{flex-basis:100%;padding-left:32px;}
  }

  @media (max-width:760px){
    .roadmap{grid-template-columns:repeat(2,1fr);}
    .pillars{grid-template-columns:1fr;}
    .motto-grid{grid-template-columns:1fr;}
    .about-wrap{grid-template-columns:1fr;}
    .about-wrap .portrait-slot{width:120px;}

    nav{padding-left:16px;padding-right:16px;}
    nav .navlinks{display:flex;gap:18px;font-size:11px;letter-spacing:.05em;overflow-x:auto;white-space:nowrap;max-width:100%;scrollbar-width:none;}
    nav .navlinks::-webkit-scrollbar{display:none;}
    section.block{padding-top:60px;}
  }

  @media (prefers-reduced-motion:no-preference){
    .switch button{transition:color .15s ease, border-color .15s ease;}
  }

  /* ===== round 2: bridge-only section, lead line, optional markers, prices, total ===== */
  section.block.bridge-only{padding-top:66px;}
  .bridge-only .bridge{margin-top:0;}
  .sys-lead{margin-top:14px;max-width:720px;font-size:clamp(19px,2.4vw,25px);line-height:1.35;font-weight:400;color:var(--ink);}
  .sys-lead b{font-weight:700;}
  .sys-lead-link{align-self:flex-start;margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-deep);text-decoration:none;border-bottom:0;}
  .sys-lead-link:hover{color:var(--ink);}
  .mtagline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .pill-opt{background:transparent;border:1px dashed var(--ink-soft);color:var(--ink);}
  .step-chip .ctag{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
  .step-chip.is-opt{border-style:dashed;}
  .step-chip.done .ctag{color:var(--ink);}
  .oprice{margin-top:4px;align-self:flex-start;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;letter-spacing:.02em;color:var(--ink);padding:2px 7px;border:1px solid #e3e3dd;background:#fff;line-height:1.35;}

html.cfg-lock,html.cfg-lock body{overflow:hidden;}

.cfg .mrow{padding:0;border:0;}

@keyframes cfgInR{from{opacity:0;transform:translateX(70px);}to{opacity:1;transform:none;}}

<script>
  var currentLang = 'de';

  function setLang(lang){
    currentLang = lang;
    document.querySelectorAll('.i18n').forEach(function(el){
      var text = el.getAttribute('data-' + lang);
      if(text) el.textContent = text;
    });
    document.getElementById('btn-lang-de').setAttribute('aria-pressed', lang === 'de');
    document.getElementById('btn-lang-en').setAttribute('aria-pressed', lang === 'en');
    document.documentElement.setAttribute('lang', lang);
    if(window.renderPicker) window.renderPicker();
  }


  /* copy helper: clipboard API inside the click handler, with execCommand fallback */
  function copyText(text){
    return new Promise(function(resolve){
      function legacy(){
        try{
          var ta = document.createElement('textarea');
          ta.value = text; ta.setAttribute('readonly','');
          ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          document.body.appendChild(ta); ta.select();
          var ok = document.execCommand && document.execCommand('copy');
          document.body.removeChild(ta);
          resolve(!!ok);
        }catch(e){ resolve(false); }
      }
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).then(function(){ resolve(true); }, legacy);
        } else { legacy(); }
      }catch(e){ legacy(); }
    });
  }

  /* contact: copy buttons */
  (function(){
    document.querySelectorAll('.copy-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var val = btn.getAttribute('data-copy');
        copyText(val).then(function(ok){
          btn.textContent = ok
            ? (currentLang === 'de' ? 'Kopiert ✓' : 'Copied ✓')
            : (currentLang === 'de' ? 'Bitte manuell kopieren' : 'Please copy manually');
          setTimeout(function(){ btn.textContent = btn.getAttribute('data-' + currentLang); }, 1800);
        });
      });
    });
  })();

  
var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* hero: interactive glow follows the cursor, and darkens the brand text where it passes over it */
  if(!prefersReducedMotion){
    (function(){
      var band = document.querySelector('.hero-band');
      var brand = document.querySelector('.hero-brand');
      var glow = document.getElementById('hero-glow');
      var mask = document.getElementById('hero-text-mask');
      var taglineWrap = document.querySelector('.tagline-wrap');
      var taglineMask = document.querySelector('.tagline-mask');
      if(!band || !glow) return;
      if(mask){
        var srcImg = document.querySelector('.hero-logo img');
        if(srcImg){
          var clone = srcImg.cloneNode(true);
          clone.removeAttribute('id');
          clone.setAttribute('aria-hidden','true');
          clone.alt = '';
          var h1 = document.createElement('h1');
          h1.className = 'hero-logo';
          h1.appendChild(clone);
          mask.appendChild(h1);
        }
      }
      band.addEventListener('mousemove', function(e){
        var rect = band.getBoundingClientRect();
        var x = ((e.clientX - rect.left) / rect.width) * 100;
        var y = ((e.clientY - rect.top) / rect.height) * 100;
        glow.style.left = x + '%';
        glow.style.top = y + '%';
        if(mask && brand){
          var brandRect = brand.getBoundingClientRect();
          mask.style.setProperty('--mx', (e.clientX - brandRect.left) + 'px');
          mask.style.setProperty('--my', (e.clientY - brandRect.top) + 'px');
          mask.style.setProperty('--mr', (glow.offsetWidth / 2) + 'px');
        }
        if(taglineMask && taglineWrap){
          var wrapRect = taglineWrap.getBoundingClientRect();
          taglineMask.style.setProperty('--tx', (e.clientX - wrapRect.left) + 'px');
          taglineMask.style.setProperty('--ty', (e.clientY - wrapRect.top) + 'px');
          taglineMask.style.setProperty('--tr', (glow.offsetWidth / 2) + 'px');
        }
      });
      band.addEventListener('mouseenter', function(){ band.classList.add('lit'); });
      band.addEventListener('mouseleave', function(){
        band.classList.remove('lit');
        if(mask){ mask.style.setProperty('--mx','-999px'); mask.style.setProperty('--my','-999px'); }
        if(taglineMask){ taglineMask.style.setProperty('--tx','-999px'); taglineMask.style.setProperty('--ty','-999px'); }
      });
    })();
  }

  
</script>
